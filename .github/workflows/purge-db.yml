name: Purge Production Database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PURGE to confirm — this deletes ALL data'
        required: true

permissions:
  contents: read

jobs:
  purge:
    name: Purge database
    runs-on: ubuntu-latest
    environment: production
    if: github.event.inputs.confirm == 'PURGE'
    steps:
      - name: Purge production database
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -Eeuo pipefail

            echo "=== Finding postgres container ==="
            DB_CONTAINER=$(docker ps -qf "name=meticle.*postgres" | head -1)
            if [ -z "$DB_CONTAINER" ]; then
              DB_CONTAINER=$(docker ps -qf "name=postgres" | head -1)
            fi
            if [ -z "$DB_CONTAINER" ]; then
              echo "ERROR: Could not find postgres container"
              docker ps --format "{{.Names}} {{.Image}}"
              exit 1
            fi
            echo "Using container: $DB_CONTAINER"

            echo "=== Pre-purge backup ==="
            docker exec "$DB_CONTAINER" pg_dump -U meticle meticle > /tmp/meticle_purge_backup_$(date +%Y%m%d_%H%M%S).sql 2>&1
            echo "Backup saved"

            echo "=== Dropping all data tables ==="
            docker exec "$DB_CONTAINER" psql -U meticle -d meticle <<'SQL'
            SET session_replication_role = 'replica';

            DO $$
            DECLARE
              r RECORD;
            BEGIN
              FOR r IN SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename NOT LIKE '\_%' AND tablename != 'spatial_ref_sys'
              LOOP
                EXECUTE 'TRUNCATE TABLE ' || quote_ident(r.tablename) || ' CASCADE';
              END LOOP;
            END $$;

            DO $$
            DECLARE
              r RECORD;
            BEGIN
              FOR r IN SELECT sequencename FROM pg_sequences WHERE schemaname = 'public'
              LOOP
                EXECUTE 'ALTER SEQUENCE ' || quote_ident(r.sequencename) || ' RESTART WITH 1';
              END LOOP;
            END $$;

            SET session_replication_role = 'origin';
            SQL

            echo "=== Clearing migration state ==="
            docker exec "$DB_CONTAINER" psql -U meticle -d meticle -c "TRUNCATE TABLE _migrations CASCADE; TRUNCATE TABLE _migration_baselines CASCADE;" 2>&1 || true

            echo "=== Finding and restarting API container ==="
            API_CONTAINER=$(docker ps -qf "name=meticle.*api" | head -1)
            if [ -z "$API_CONTAINER" ]; then
              API_CONTAINER=$(docker ps -qf "name=api" | head -1)
            fi
            if [ -n "$API_CONTAINER" ]; then
              docker restart "$API_CONTAINER"
              echo "API container restarted"
            else
              echo "WARNING: Could not find API container, skipping restart"
            fi

            echo "=== Waiting for API to be healthy ==="
            sleep 15
            for i in $(seq 1 20); do
              if curl -fsS --max-time 5 http://localhost:3000/api/health 2>/dev/null | grep -q '"status"'; then
                echo "API is healthy"
                break
              fi
              echo "Waiting for API... ($i/20)"
              sleep 3
            done

            echo "=== Database purge complete ==="
