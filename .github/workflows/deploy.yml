name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        include:
          - context: .
            dockerfile: apps/api/Dockerfile.prod
            image: meticle-api
          - context: .
            dockerfile: apps/web/Dockerfile
            image: meticle-web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}-${{ github.sha }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ github.sha }},mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/meticle

            GHCR_owner="${{ github.repository_owner }}"
            IMAGE_TAG="${{ github.sha }}"
            export GHCR_OWNER="$GHCR_owner"

            echo "=== Pre-deploy checks ==="
            df -h / | awk 'NR==2 {printf "Disk: %s used of %s (%s)\n", $3, $2, $5}'
            AVAIL_KB=$(df / --output=avail -k | tail -1 | tr -d ' ')
            if [ "$AVAIL_KB" -lt 2048000 ]; then
              echo "ERROR: Less than 2GB free disk space"
              exit 1
            fi

            if [ ! -f .env ]; then
              echo "ERROR: .env file missing"
              exit 1
            fi

            echo "=== Sync source on VPS ==="
            git fetch origin master
            git reset --hard origin/master

            echo "=== Pull new images ==="
            docker pull "ghcr.io/${GHCR_owner}/meticle-api:${IMAGE_TAG}"
            docker pull "ghcr.io/${GHCR_owner}/meticle-web:${IMAGE_TAG}"

            echo "=== Pin image tags for every compose invocation ==="
            export API_TAG="$IMAGE_TAG"
            export WEB_TAG="$IMAGE_TAG"

            echo "=== Save current running tags for rollback ==="
            PREV_API_TAG=$(docker inspect meticle-api-1 --format='{{.Config.Image}}' 2>/dev/null | sed 's/.*://;s/.*@//' || echo "latest")
            PREV_WEB_TAG=$(docker inspect meticle-web-1 --format='{{.Config.Image}}' 2>/dev/null | sed 's/.*://;s/.*@//' || echo "latest")
            echo "Previous API tag: $PREV_API_TAG"
            echo "Previous Web tag: $PREV_WEB_TAG"

            echo "=== Ensure infrastructure running ==="
            docker compose -f docker-compose.prod.yml up -d db redis uptime

            echo "=== Run migrations ==="
            docker compose -f docker-compose.prod.yml run --rm api sh -c "node apps/api/dist/shared/database/setup.js"

            echo "=== Wait for DB migration ==="
            sleep 3

            echo "=== Deploy API (with rollback) ==="
            docker compose -f docker-compose.prod.yml up -d --force-recreate api
            API_HEALTHY=false
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T api wget -qO- http://localhost:3002/health/live 2>/dev/null | grep -q '"status":"ok"'; then
                echo "API healthy"
                API_HEALTHY=true
                break
              fi
              sleep 2
            done
            if [ "$API_HEALTHY" = false ]; then
              echo "API health check failed — rolling back"
              API_TAG="$PREV_API_TAG" docker compose -f docker-compose.prod.yml up -d --force-recreate api
              exit 1
            fi

            echo "=== Deploy Web (with rollback) ==="
            docker compose -f docker-compose.prod.yml up -d --force-recreate web
            WEB_HEALTHY=false
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8080/ >/dev/null 2>&1; then
                echo "Web healthy"
                WEB_HEALTHY=true
                break
              fi
              sleep 2
            done
            if [ "$WEB_HEALTHY" = false ]; then
              echo "Web health check failed — rolling back"
              WEB_TAG="$PREV_WEB_TAG" docker compose -f docker-compose.prod.yml up -d --force-recreate web
              exit 1
            fi

            echo "=== Verify production ==="
            curl -sf -o /dev/null https://meticlecare.com || { echo "ERROR: Frontend unreachable"; exit 1; }
            curl -sf https://meticlecare.com/api/health/live | grep -q '"status":"ok"' || { echo "ERROR: API unreachable via nginx"; exit 1; }

            echo "=== Cleanup old images ==="
            docker image prune -af --filter "until=168h" || true

            echo "=== Deployment complete ==="
