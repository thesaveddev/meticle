name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  packages: write

env:
  RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  RELEASE_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate-production-config:
    name: Validate production deploy configuration
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - name: Require deployment variables and smoke-test credentials
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          COMPOSE_FILE: ${{ vars.COMPOSE_FILE }}
          DEPLOY_SCRIPT: ${{ vars.DEPLOY_SCRIPT }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_API_HEALTH_URL: ${{ vars.PUBLIC_API_HEALTH_URL }}
          INTERNAL_API_HEALTH_URL: ${{ vars.INTERNAL_API_HEALTH_URL }}
          INTERNAL_WEB_URL: ${{ vars.INTERNAL_WEB_URL }}
          AUTH_LOGIN_URL: ${{ vars.AUTH_LOGIN_URL }}
          AUTH_ME_URL: ${{ vars.AUTH_ME_URL }}
          DEPLOY_LOCK_FILE: ${{ vars.DEPLOY_LOCK_FILE }}
          RELEASE_STATE_DIR: ${{ vars.RELEASE_STATE_DIR }}
          RELEASE_RETENTION_COUNT: ${{ vars.RELEASE_RETENTION_COUNT }}
          MIN_FREE_KB: ${{ vars.MIN_FREE_KB }}
          DEPLOY_ALERT_TO: ${{ vars.DEPLOY_ALERT_TO }}
          AUTH_SMOKE_EMAIL: ${{ secrets.DEPLOY_SMOKE_EMAIL }}
          AUTH_SMOKE_PASSWORD: ${{ secrets.DEPLOY_SMOKE_PASSWORD }}
        run: |
          set -Eeuo pipefail
          missing=()
          for name in DEPLOY_DIR COMPOSE_FILE DEPLOY_SCRIPT PUBLIC_SITE_URL PUBLIC_API_HEALTH_URL INTERNAL_API_HEALTH_URL INTERNAL_WEB_URL AUTH_LOGIN_URL AUTH_ME_URL DEPLOY_LOCK_FILE RELEASE_STATE_DIR RELEASE_RETENTION_COUNT MIN_FREE_KB DEPLOY_ALERT_TO AUTH_SMOKE_EMAIL AUTH_SMOKE_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo "Production deployment configuration is present"

  build-api:
    name: Build API image
    runs-on: ubuntu-latest
    environment: production
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && needs.validate-production-config.result == 'success' }}
    needs: validate-production-config
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out triggering release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile.prod
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/meticle-api:${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=meticle-api
          cache-to: type=gha,scope=meticle-api,mode=max

  build-web:
    name: Build web image
    runs-on: ubuntu-latest
    environment: production
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && needs.validate-production-config.result == 'success' }}
    needs: validate-production-config
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out triggering release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable web image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            VITE_PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL }}
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          tags: ghcr.io/${{ github.repository_owner }}/meticle-web:${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=meticle-web
          cache-to: type=gha,scope=meticle-web,mode=max

  deploy:
    name: Deploy immutable release
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    environment: production
    steps:
      - name: Deploy immutable release to VPS
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          COMPOSE_FILE: ${{ vars.COMPOSE_FILE }}
          DEPLOY_SCRIPT: ${{ vars.DEPLOY_SCRIPT }}
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
          API_IMAGE_REF: ghcr.io/${{ github.repository_owner }}/meticle-api@${{ needs.build-api.outputs.digest }}
          WEB_IMAGE_REF: ghcr.io/${{ github.repository_owner }}/meticle-web@${{ needs.build-web.outputs.digest }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_API_HEALTH_URL: ${{ vars.PUBLIC_API_HEALTH_URL }}
          INTERNAL_API_HEALTH_URL: ${{ vars.INTERNAL_API_HEALTH_URL }}
          INTERNAL_WEB_URL: ${{ vars.INTERNAL_WEB_URL }}
          AUTH_LOGIN_URL: ${{ vars.AUTH_LOGIN_URL }}
          AUTH_ME_URL: ${{ vars.AUTH_ME_URL }}
          AUTH_SMOKE_EMAIL: ${{ secrets.DEPLOY_SMOKE_EMAIL }}
          AUTH_SMOKE_PASSWORD: ${{ secrets.DEPLOY_SMOKE_PASSWORD }}
          DEPLOY_ALERT_TO: ${{ vars.DEPLOY_ALERT_TO }}
          DEPLOY_LOCK_FILE: ${{ vars.DEPLOY_LOCK_FILE }}
          RELEASE_STATE_DIR: ${{ vars.RELEASE_STATE_DIR }}
          RELEASE_RETENTION_COUNT: ${{ vars.RELEASE_RETENTION_COUNT }}
          MIN_FREE_KB: ${{ vars.MIN_FREE_KB }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_DIR,COMPOSE_FILE,DEPLOY_SCRIPT,RELEASE_SHA,API_IMAGE_REF,WEB_IMAGE_REF,PUBLIC_SITE_URL,PUBLIC_API_HEALTH_URL,INTERNAL_API_HEALTH_URL,INTERNAL_WEB_URL,AUTH_LOGIN_URL,AUTH_ME_URL,AUTH_SMOKE_EMAIL,AUTH_SMOKE_PASSWORD,DEPLOY_ALERT_TO,DEPLOY_LOCK_FILE,RELEASE_STATE_DIR,RELEASE_RETENTION_COUNT,MIN_FREE_KB
          script: |
            set -Eeuo pipefail
            : "${DEPLOY_DIR:?DEPLOY_DIR is required}"
            : "${RELEASE_SHA:?RELEASE_SHA is required}"
            cd "$DEPLOY_DIR"
            git fetch origin master --quiet
            git cat-file -e "$RELEASE_SHA^{commit}"
            git reset --hard "$RELEASE_SHA" --quiet
            if [ ! -f "$DEPLOY_SCRIPT" ]; then
              echo "ERROR: deployment script not found after release sync: $DEPLOY_SCRIPT" >&2
              exit 1
            fi
            chmod 750 "$DEPLOY_SCRIPT"
            case "$DEPLOY_SCRIPT" in
              /*|./*) exec "$DEPLOY_SCRIPT" ;;
              *) exec "./$DEPLOY_SCRIPT" ;;
            esac

  notify-failure:
    name: Notify failed deployment
    if: ${{ always() && (needs.validate-production-config.result == 'failure' || needs.build-api.result == 'failure' || needs.build-web.result == 'failure' || needs.deploy.result == 'failure') }}
    needs: [validate-production-config, build-api, build-web, deploy]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out notification helper
        uses: actions/checkout@v4
      - name: Send Slack and email alerts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.DEPLOY_SLACK_WEBHOOK_URL }}
          DEPLOY_SMTP_HOST: ${{ secrets.DEPLOY_SMTP_HOST }}
          DEPLOY_SMTP_PORT: ${{ secrets.DEPLOY_SMTP_PORT }}
          DEPLOY_SMTP_SECURE: ${{ secrets.DEPLOY_SMTP_SECURE }}
          DEPLOY_SMTP_USER: ${{ secrets.DEPLOY_SMTP_USER }}
          DEPLOY_SMTP_PASS: ${{ secrets.DEPLOY_SMTP_PASS }}
          DEPLOY_SMTP_FROM: ${{ secrets.DEPLOY_SMTP_FROM }}
          DEPLOY_ALERT_TO: ${{ vars.DEPLOY_ALERT_TO }}
          BUILD_CONFIG_RESULT: ${{ needs.validate-production-config.result }}
          BUILD_API_RESULT: ${{ needs.build-api.result }}
          BUILD_WEB_RESULT: ${{ needs.build-web.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ env.RELEASE_SHA }}
          BRANCH_NAME: ${{ env.RELEASE_BRANCH }}
        run: |
          set -euo pipefail
          if [ "$BUILD_CONFIG_RESULT" = "failure" ]; then
            FAILED_STAGE="production configuration validation"
          elif [ "$BUILD_API_RESULT" = "failure" ] || [ "$BUILD_WEB_RESULT" = "failure" ]; then
            FAILED_STAGE="image build"
          else
            FAILED_STAGE="production deployment or rollback"
          fi
          export FAILED_STAGE
          python3 .github/scripts/notify-deploy.py
