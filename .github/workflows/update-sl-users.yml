name: Update DreakCare Supported Living Users

on:
  push:
    branches: [seed/sl-users]
  workflow_dispatch:

jobs:
  sync-users:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Get commit SHA
        id: sha
        run: echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sync supported-living users on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            CONTAINER=$(docker ps -q -f name=api | head -1)
            if [ -z "$CONTAINER" ]; then CONTAINER=$(docker ps -q | head -1); fi
            if [ -z "$CONTAINER" ]; then docker ps -a; echo "No containers"; exit 1; fi
            echo "Container: $CONTAINER"
            SHA="${{ steps.sha.outputs.SHA }}"
            echo "Downloading update script (commit $SHA)..."
            curl -fsSL "https://raw.githubusercontent.com/thesaveddev/meticle/${SHA}/scripts/update-sl-users.js" -o /tmp/users.js
            echo "Copying to container..."
            docker cp /tmp/users.js "$CONTAINER:/app/users.js"
            echo "Running user sync..."
            docker exec -w /app "$CONTAINER" node users.js
            RC=$?
            echo "Exit code: $RC"
            docker exec "$CONTAINER" rm -f /app/users.js
            rm -f /tmp/users.js
            echo "Done"
            exit $RC
