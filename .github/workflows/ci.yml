name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: meticle_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/meticle_test
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=@meticle/shared
      - name: Type check API
        run: npx tsc --noEmit
        working-directory: apps/api
      - name: Lint web
        run: npm run lint
        working-directory: apps/web
        continue-on-error: true
      - name: Setup test database
        run: npx ts-node src/shared/database/setup.ts
        working-directory: apps/api
      - name: Run API tests
        run: npm test
        working-directory: apps/api
      - name: Type check web
        run: npx tsc --noEmit
        working-directory: apps/web

  build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Build shared
        run: npm run build --workspace=@meticle/shared
      - name: Build API
        run: npm run build -w apps/api
      - name: Build web
        run: npm run build -w apps/web
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/meticle
            export TAG=${{ github.sha }}
            export GIT_SSH_COMMAND="ssh -i /root/.ssh/github_deploy_key -o StrictHostKeyChecking=no"
            git pull origin master

            # Pull images from registry
            docker compose -f docker-compose.prod.yml pull api web

            # Run database migrations
            docker compose -f docker-compose.prod.yml run --rm api node apps/api/dist/shared/database/setup.js

            # Ensure db and redis are running (don't force-recreate — would lose data)
            docker compose -f docker-compose.prod.yml up -d db redis

            # Restart api and web with new images
            docker compose -f docker-compose.prod.yml up -d --force-recreate api web

            echo "Waiting for API health..."
            API_HEALTHY=false
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T api wget -qO- http://localhost:3002/health/live 2>/dev/null | grep -q '"status":"ok"'; then
                echo "API healthy"
                API_HEALTHY=true
                break
              fi
              sleep 2
            done
            if [ "$API_HEALTHY" = false ]; then
              echo "API failed health check"
              exit 1
            fi

            # Verify production endpoint
            echo "Verifying production frontend..."
            curl -sf -o /dev/null https://meticlecare.com || echo "Warning: Frontend unreachable"
            echo "Verifying production API..."
            curl -sf https://meticlecare.com/api/health/live | grep -q '"status":"ok"' || echo "Warning: API unreachable"

            echo "Deployment complete ($TAG)"
