name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: meticle_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://meticle_app:ci_test_password@localhost:5432/meticle_test
      DATABASE_MIGRATE_URL: postgres://postgres:postgres@localhost:5432/meticle_test
      APP_ROLE_PASSWORD: ci_test_password
      JWT_SECRET: ci-test-secret-that-is-at-least-32
      JWT_REFRESH_SECRET: ci-test-refresh-secret-that-is-at-least-32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=@meticle/shared
      - name: Type check API
        run: npx tsc --noEmit
        working-directory: apps/api
      - name: Lint web
        run: npm run lint
        working-directory: apps/web
      # The claim guard lives here, and until 27 Sep 2026 it had never once
      # gated a build. It caught a real false claim on its first run, which is
      # exactly the point of running it — but a test nobody runs is a comment.
      #
      # Web checks run before the API suite on purpose: they need no database,
      # so they are the fastest steps that can still fail, and a copy change
      # should not wait behind a full API run to be told it is unevidenced.
      - name: Type check web
        run: npx tsc --noEmit
        working-directory: apps/web
      - name: Run web tests
        run: npm test
        working-directory: apps/web
      - name: Create app role for RLS-enforced tests
        run: psql -h localhost -U postgres -d meticle_test -c "CREATE ROLE meticle_app WITH LOGIN PASSWORD 'ci_test_password';"
        env:
          PGPASSWORD: postgres
      - name: Setup test database
        run: npx ts-node src/shared/database/setup.ts
        working-directory: apps/api
      - name: Run API tests
        run: npm test
        working-directory: apps/api
      - name: Type check mobile
        run: npx tsc --noEmit
        working-directory: apps/mobile
      - name: Lint mobile
        run: npm run lint
        working-directory: apps/mobile
      - name: Run mobile tests
        run: npm test -- --ci
        working-directory: apps/mobile

      # The store-screenshot fixtures are invented care records, and a release
      # build shipped them once because the __DEV__ gate stops code running but
      # cannot stop Metro bundling it. Only a real bundle proves they are gone,
      # so this cannot be a unit test. Slow, and deliberately not part of
      # `verify` because it exports the whole app.
      - name: Check no capture fixtures ship in a store bundle
        run: npm run verify:no-fixtures
        working-directory: apps/mobile

  # The design system used to be two hand-maintained files that had already
  # drifted from the code they described, and nothing noticed. These two jobs
  # are the noticing. The first needs no database and no browser, so it is the
  # cheapest thing in this workflow that can still go red.
  design-system:
    name: Design system (drift + palette lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Design token unit tests
        run: npm run design:test
      # Generated artifacts must match scripts/design/palette.mjs. Hand-editing
      # DESIGN.md or .impeccable/design.json is what this catches.
      - name: Design artifacts are not stale
        run: npm run design:check
      # Off-palette hex literals. Existing debt is baselined; anything new fails.
      - name: No new off-palette colours
        run: npm run design:lint

  visual-regression:
    name: Visual regression (marketing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=@meticle/shared
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Never --update-snapshots here. Regenerating the baseline in CI would
      # make the job unfailable and turn it into a slow no-op.
      - name: Marketing screenshots match baselines
        run: npm run visual:test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            tests/visual/__results__/
          retention-days: 7

  # Deploy is now handled by .github/workflows/deploy.yml
