name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: meticle_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://meticle_app:ci_test_password@localhost:5432/meticle_test
      DATABASE_MIGRATE_URL: postgres://postgres:postgres@localhost:5432/meticle_test
      APP_ROLE_PASSWORD: ci_test_password
      JWT_SECRET: ci-test-secret-that-is-at-least-32
      JWT_REFRESH_SECRET: ci-test-refresh-secret-that-is-at-least-32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=@meticle/shared
      - name: Type check API
        run: npx tsc --noEmit
        working-directory: apps/api
      - name: Lint web
        run: npm run lint
        working-directory: apps/web
        continue-on-error: true
      - name: Create app role for RLS-enforced tests
        run: psql -h localhost -U postgres -d meticle_test -c "CREATE ROLE meticle_app WITH LOGIN PASSWORD 'ci_test_password';"
        env:
          PGPASSWORD: postgres
      - name: Setup test database
        run: npx ts-node src/shared/database/setup.ts
        working-directory: apps/api
      - name: Run API tests
        run: npm test
        working-directory: apps/api
      - name: Type check web
        run: npx tsc --noEmit
        working-directory: apps/web

  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/meticle
            export GIT_SSH_COMMAND="ssh -i /root/.ssh/github_deploy_key -o StrictHostKeyChecking=no"
            git stash --include-untracked
            git pull origin master

            # Build images on the VPS
            docker compose -f docker-compose.prod.yml build api web

            # Ensure db and redis are running (don't force-recreate — would lose data)
            docker compose -f docker-compose.prod.yml up -d db redis uptime

            # Run database migrations
            docker compose -f docker-compose.prod.yml run --rm api node apps/api/dist/shared/database/setup.js

            # Restart api and web with new images
            docker compose -f docker-compose.prod.yml up -d --force-recreate api web

            echo "Waiting for API health..."
            API_HEALTHY=false
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T api wget -qO- http://localhost:3002/health/live 2>/dev/null | grep -q '"status":"ok"'; then
                echo "API healthy"
                API_HEALTHY=true
                break
              fi
              sleep 2
            done
            if [ "$API_HEALTHY" = false ]; then
              echo "API failed health check"
              exit 1
            fi

            # Verify production endpoint
            echo "Verifying production frontend..."
            curl -sf -o /dev/null https://meticlecare.com || echo "Warning: Frontend unreachable"
            echo "Verifying production API..."
            curl -sf https://meticlecare.com/api/health/live | grep -q '"status":"ok"' || echo "Warning: API unreachable"

            echo "Deployment complete"
