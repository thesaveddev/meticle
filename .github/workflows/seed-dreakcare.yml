name: Seed DreakCare Demo Org

on:
  push:
    branches: [seed/dreakcare]
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Upload seed script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "scripts/seed-dreakcare.js"
          target: "/root/seed-dreakcare.js"
          strip_components: 1

      - name: Run seed in API container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -x
            # Find the API container
            CONTAINER=$(docker ps -q -f name=api | head -1)
            if [ -z "$CONTAINER" ]; then
              echo "Listing all containers..."
              docker ps -a
              CONTAINER=$(docker ps -q | head -1)
            fi
            if [ -z "$CONTAINER" ]; then
              echo "ERROR: No containers running"
              exit 1
            fi
            echo "Using container: $CONTAINER"

            # Verify the file exists on VPS host
            ls -la /root/seed-dreakcare.js

            # Copy into container
            docker cp /root/seed-dreakcare.js "$CONTAINER:/tmp/seed.js"

            # Verify file exists inside container
            docker exec "$CONTAINER" ls -la /tmp/seed.js

            # Run the seed
            docker exec "$CONTAINER" node /tmp/seed.js

            # Cleanup
            docker exec "$CONTAINER" rm -f /tmp/seed.js
            rm -f /root/seed-dreakcare.js

            echo "Seed complete"
