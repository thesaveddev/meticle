name: Seed DreakCare Demo Org

on:
  push:
    branches: [seed/dreakcare]
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Encode seed script
        id: encode
        run: echo "B64=$(base64 -w0 scripts/seed-dreakcare.js)" >> "$GITHUB_OUTPUT"

      - name: Run seed on production VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -ex
            echo "${{ steps.encode.outputs.B64 }}" | base64 -d > /tmp/seed.js
            CONTAINER=$(docker ps -q -f name=api | head -1)
            if [ -z "$CONTAINER" ]; then
              docker ps -a
              CONTAINER=$(docker ps -q | head -1)
            fi
            if [ -z "$CONTAINER" ]; then
              echo "ERROR: No containers running"
              exit 1
            fi
            echo "Container: $CONTAINER"
            docker cp /tmp/seed.js "$CONTAINER:/tmp/seed.js"
            docker exec "$CONTAINER" node /tmp/seed.js
            docker exec "$CONTAINER" rm -f /tmp/seed.js
            rm -f /tmp/seed.js
            echo "Seed complete"
