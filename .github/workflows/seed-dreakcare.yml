name: Seed DreakCare Demo Org

on:
  push:
    branches: [seed/dreakcare]
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Get commit SHA
        id: sha
        run: echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Seed DreakCare on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            CONTAINER=$(docker ps -q -f name=api | head -1)
            if [ -z "$CONTAINER" ]; then CONTAINER=$(docker ps -q | head -1); fi
            if [ -z "$CONTAINER" ]; then docker ps -a; echo "No containers"; exit 1; fi
            echo "Container: $CONTAINER"
            EXISTS=$(docker exec "$CONTAINER" node -e "const p=require('pg');new p.Pool().query(\"SELECT id FROM organizations WHERE slug='dreakcare'\").then(r=>{process.stdout.write(r.rows.length?'YES':'NO')}).catch(()=>{process.stdout.write('NO')}).finally(()=>process.exit())" 2>/dev/null) || true
            if [ "$EXISTS" = "YES" ]; then echo "Already seeded"; exit 0; fi
            echo "Checking env vars..."
            docker exec "$CONTAINER" node -e "console.log('DATABASE_URL:', process.env.DATABASE_URL ? 'SET' : 'NOT SET'); console.log('PGHOST:', process.env.PGHOST || 'NOT SET')" 2>&1
            echo "Testing pool with explicit string..."
            docker exec -w /app "$CONTAINER" node -e "
              const { Pool } = require('pg');
              const url = process.env.DATABASE_URL;
              console.log('DATABASE_URL in app:', url ? url.substring(0,40)+'...' : 'NOT SET');
              const pool = url ? new Pool({ connectionString: url }) : new Pool();
              pool.query('SELECT count(*) as cnt FROM organizations').then(r=>{console.log('Orgs:', r.rows[0].cnt);pool.end()}).catch(e=>{console.error('Error:', e.message, e.code);pool.end()}).finally(()=>process.exit());
            " 2>&1
            SHA="${{ steps.sha.outputs.SHA }}"
            curl -fsSL "https://raw.githubusercontent.com/thesaveddev/meticle/${SHA}/scripts/seed-dreakcare.js" -o /tmp/seed.js
            docker cp /tmp/seed.js "$CONTAINER:/app/seed.js"
            echo "Running seed..."
            docker exec -w /app "$CONTAINER" node seed.js 2>&1 || echo "Seed had errors (see above)"
            docker exec "$CONTAINER" rm -f /app/seed.js
            rm -f /tmp/seed.js
            echo "=== Complete ==="
