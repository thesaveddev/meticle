name: Seed DreakCare Demo Org

on:
  push:
    branches: [seed/dreakcare]
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Save SSH key
        run: |
          printf '%s' "$SSH_KEY" > /tmp/vps_key
          chmod 600 /tmp/vps_key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Seed DreakCare on VPS
        run: |
          set -e
          HOST=${{ secrets.VPS_HOST }}
          SSH_OPTS="-o StrictHostKeyChecking=no -i /tmp/vps_key"

          # Find container
          CONTAINER=$(ssh $SSH_OPTS root@$HOST "docker ps -q -f name=api | head -1")
          if [ -z "$CONTAINER" ]; then
            CONTAINER=$(ssh $SSH_OPTS root@$HOST "docker ps -q | head -1")
          fi
          if [ -z "$CONTAINER" ]; then
            echo "No containers running!"
            ssh $SSH_OPTS root@$HOST "docker ps -a"
            exit 1
          fi
          echo "Container: $CONTAINER"

          # Check if already seeded
          EXISTS=$(ssh $SSH_OPTS root@$HOST \
            "docker exec $CONTAINER node -e \"const p=require('pg');new p.Pool().query(\\\"SELECT id FROM organizations WHERE slug='dreakcare'\\\").then(r=>{process.stdout.write(r.rows.length?'YES':'NO')}).catch(()=>{process.stdout.write('NO')}).finally(()=>process.exit())\"" || echo "NO")
          echo "Exists: $EXISTS"
          if [ "$EXISTS" = "YES" ]; then
            echo "DreakCare already exists, skipping"
            exit 0
          fi

          # Write script to VPS using printf to preserve content
          ssh $SSH_OPTS root@$HOST "cat > /root/seed.js" < scripts/seed-dreakcare.js

          # Copy into container and run
          ssh $SSH_OPTS root@$HOST "docker cp /root/seed.js $CONTAINER:/tmp/seed.js"
          ssh $SSH_OPTS root@$HOST "docker exec $CONTAINER node /tmp/seed.js"

          # Cleanup
          ssh $SSH_OPTS root@$HOST "docker exec $CONTAINER rm -f /tmp/seed.js; rm -f /root/seed.js"

          echo "=== Seed complete ==="
