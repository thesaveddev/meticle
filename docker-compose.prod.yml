services:
  web:
    image: ghcr.io/${GHCR_OWNER:-thesaveddev}/meticle-web:${WEB_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meticle

  api:
    image: ghcr.io/${GHCR_OWNER:-thesaveddev}/meticle-api:${API_TAG:-latest}
    restart: unless-stopped
    expose:
      - 3002
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://meticle_app:${APP_ROLE_PASSWORD}@db:5432/meticle
      - DATABASE_MIGRATE_URL=postgresql://meticle:${POSTGRES_PASSWORD}@db:5432/meticle
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FRONTEND_URL=https://meticlecare.com
      - CORS_ORIGINS=${CORS_ORIGINS:-https://meticlecare.com}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER:-}
      - STRIPE_PRICE_PROFESSIONAL=${STRIPE_PRICE_PROFESSIONAL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - meticle

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=meticle
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=meticle
      - APP_ROLE_PASSWORD=${APP_ROLE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/scripts/create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meticle"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - meticle

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - meticle

  backup:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=meticle
      - DB_USER=meticle
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - backup_data:/backups
      - ./apps/api/scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: |
      sh -c '
        apk add --no-cache bash > /dev/null 2>&1
        echo "0 2 * * * /usr/local/bin/backup.sh" > /etc/crontabs/root
        echo "[$$] Backup service ready. Runs daily at 2am."
        crond -f -l 2
      '
    depends_on:
      db:
        condition: service_healthy
    networks:
      - meticle

  uptime:
    image: louislam/uptime-kuma:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3099:3001"
    volumes:
      - uptime_data:/app/data
    networks:
      - meticle

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  backup_data:
  uptime_data:

networks:
  meticle:
