services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be a digest-pinned image reference}
    restart: unless-stopped
    logging:
      driver: json-file
      # Docker defaults to unbounded json-file logs. Under a busy day this
      # fills the host disk, and the first casualty of a full disk is the
      # Postgres volume the whole product depends on. 10 MB x 3 files per
      # service caps each at 30 MB (T0-13).
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meticle

  api:
    image: ${API_IMAGE:?API_IMAGE must be a digest-pinned image reference}
    restart: unless-stopped
    logging:
      driver: json-file
      # Docker defaults to unbounded json-file logs. Under a busy day this
      # fills the host disk, and the first casualty of a full disk is the
      # Postgres volume the whole product depends on. 10 MB x 3 files per
      # service caps each at 30 MB (T0-13).
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits (T1-7). A service that leaks or spikes must not be able to
    # starve the database on the same host. The API gets the most headroom; the
    # DB is protected by the kernel OOM scorer ranking "critical" via shm.
    mem_limit: 2g
    cpus: 1.5
    expose:
      - 3002
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://meticle_app:${APP_ROLE_PASSWORD}@db:5432/meticle
      - DATABASE_MIGRATE_URL=postgresql://meticle:${POSTGRES_PASSWORD}@db:5432/meticle
      - APP_ROLE_PASSWORD=${APP_ROLE_PASSWORD}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL must be configured}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS must be configured}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER:-}
      - STRIPE_PRICE_PROFESSIONAL=${STRIPE_PRICE_PROFESSIONAL:-}
      # Domiciliary-care emails are paused until explicitly enabled.
      - HOMECARE_EMAILS_ENABLED=${HOMECARE_EMAILS_ENABLED:-false}
      # Mandatory. The API exits at boot without a well-formed key (T0-15): PII
      # columns are encrypted under a per-organisation key derived from it, and
      # starting without one would write plaintext to columns that read as
      # encrypted. Required, not defaulted — there is no safe default.
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY must be configured}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - meticle

  db:
    image: postgres@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    restart: unless-stopped
    logging:
      driver: json-file
      # Docker defaults to unbounded json-file logs. Under a busy day this
      # fills the host disk, and the first casualty of a full disk is the
      # Postgres volume the whole product depends on. 10 MB x 3 files per
      # service caps each at 30 MB (T0-13).
      options:
        max-size: "10m"
        max-file: "3"
    # The database is the one service that must never be OOM-killed. Postgres
    # shared memory is sized separately so the limit is predictable (T1-7).
    mem_limit: 4g
    shm_size: 256mb
    # Point-in-time recovery.
    #
    # `archive_mode` and `archive_command` are set here rather than in a mounted
    # conf file because the image is digest-pinned and pulled from a registry —
    # there is no build context to COPY a config into. Setting them as command
    # arguments keeps them visible in this file rather than hidden in an image.
    #
    # WARNING: archive_mode cannot be changed with a reload. Applying this
    # restarts Postgres, which is a brief outage for every customer.
    #
    # `wal_level` must be replica or higher for archiving to work; the default
    # already is, but it is stated explicitly because a silently lower value is
    # exactly the kind of thing that turns PITR off without saying so.
    #
    # archive_timeout forces a segment switch every 5 minutes so replay can
    # never be more than that behind. Without it a quiet database can leave
    # hours of changes in an unswitched segment that has not been archived yet.
    #
    # This is a shell wrapper, not a bare argument list, and the two lines above
    # `exec` are load-bearing. `archive_command` runs as the postgres server
    # process and writes into the `backup_data` volume mounted at /backups — a
    # Docker named volume is root-owned by default, and the server runs as the
    # postgres user. Without the mkdir and chown below, every archive attempt
    # fails, Postgres logs a warning and carries on, and the segments it cannot
    # archive are never recycled. They accumulate in pg_wal until the disk fills
    # and the database stops accepting writes. It fails quietly, which is the
    # worst possible time to find out, so the directory is created and handed
    # over here — in the db container itself, before the server starts, rather
    # than relying on the backup container having run first.
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /backups/wal
        chown -R postgres:postgres /backups
        exec docker-entrypoint.sh postgres \
          -c archive_mode=on \
          -c wal_level=replica \
          -c "archive_command=test ! -f /backups/wal/%f && cp %p /backups/wal/%f" \
          -c archive_timeout=300 \
          -c max_wal_senders=0
    environment:
      - POSTGRES_USER=meticle
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=meticle
      - APP_ROLE_PASSWORD=${APP_ROLE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Shared with the backup service. Deliberately a *different* volume from
      # postgres_data: if both the database and its recovery points live on one
      # volume, losing that volume loses the backups along with the data, which
      # is the situation backups exist to prevent.
      - backup_data:/backups
      - ./apps/api/scripts/create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meticle"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - meticle

  redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    logging:
      driver: json-file
      # Docker defaults to unbounded json-file logs. Under a busy day this
      # fills the host disk, and the first casualty of a full disk is the
      # Postgres volume the whole product depends on. 10 MB x 3 files per
      # service caps each at 30 MB (T0-13).
      options:
        max-size: "10m"
        max-file: "3"
    # Redis is a cache and queue here; losing it is an annoyance, not data loss.
    # 512 MB keeps it from competing with the database for memory (T1-7).
    mem_limit: 512m
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # REDIS_URL is redis://redis:6379, so the service name must always be a
    # resolvable alias. Containers created outside this Compose project can
    # otherwise lose it and every Redis-backed request stalls on DNS.
    networks:
      meticle:
        aliases:
          - redis

  backup:
    image: postgres@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    restart: unless-stopped
    logging:
      driver: json-file
      # Docker defaults to unbounded json-file logs. Under a busy day this
      # fills the host disk, and the first casualty of a full disk is the
      # Postgres volume the whole product depends on. 10 MB x 3 files per
      # service caps each at 30 MB (T0-13).
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=meticle
      - DB_USER=meticle
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - backup_data:/backups
      - ./apps/api/scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./apps/api/scripts/restore.sh:/usr/local/bin/restore.sh:ro
    entrypoint: |
      sh -c '
        apk add --no-cache bash > /dev/null 2>&1
        # The db container archives WAL here as the postgres user, which cannot
        # create the directory itself in a root-owned volume. Creating it here
        # and handing it over means archiving works from the first segment
        # rather than failing silently until someone notices the gap.
        mkdir -p /backups/wal && chown -R postgres:postgres /backups
        echo "0 2 * * * sh /usr/local/bin/backup.sh" > /etc/crontabs/root
        echo "[$$] Backup service ready. Runs daily at 2am. PITR archive at /backups/wal."
        crond -f -l 2
      '
    depends_on:
      db:
        condition: service_healthy
    networks:
      - meticle

  uptime:
    image: louislam/uptime-kuma@sha256:0f6c88f1e5f98146dcc2ca8408d2982e2d25db968be14ff718e10a59c9a84938
    restart: unless-stopped
    logging:
      driver: json-file
      # Docker defaults to unbounded json-file logs. Under a busy day this
      # fills the host disk, and the first casualty of a full disk is the
      # Postgres volume the whole product depends on. 10 MB x 3 files per
      # service caps each at 30 MB (T0-13).
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:3099:3001"
    volumes:
      - uptime_data:/app/data
    networks:
      - meticle

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  backup_data:
  uptime_data:

networks:
  meticle:
