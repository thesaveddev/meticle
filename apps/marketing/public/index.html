<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareDesk Marketing</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F3F4F6; color: #111827; }
    .topbar { background: #0F4C81; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .topbar h1 { font-size: 1.2rem; font-weight: 800; }
    .stats { display: flex; gap: 24px; font-size: 0.85rem; }
    .stats span { opacity: 0.85; }
    .stats strong { font-size: 1.1rem; }
    .controls { padding: 16px 24px; background: #fff; border-bottom: 1px solid #E5E7EB; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .controls button, .controls select, .controls input { padding: 6px 14px; border: 1px solid #D1D5DB; border-radius: 6px; font-size: 0.85rem; background: #fff; cursor: pointer; }
    .controls button.primary { background: #0F4C81; color: #fff; border-color: #0F4C81; font-weight: 600; }
    .controls button.warn { background: #FEF3C7; color: #92400E; border-color: #F59E0B; }
    .controls button.danger { background: #FEE2E2; color: #991B1B; border-color: #EF4444; }
    .controls input[type=text] { min-width: 200px; cursor: text; }
    .pipeline { display: flex; gap: 12px; padding: 16px 24px; overflow-x: auto; }
    .column { flex: 1; min-width: 180px; background: #F9FAFB; border-radius: 8px; padding: 12px; border: 1px solid #E5E7EB; }
    .column h3 { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #6B7280; margin-bottom: 8px; }
    .card { background: #fff; border: 1px solid #E5E7EB; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; font-size: 0.82rem; }
    .card:hover { border-color: #0F4C81; }
    .card .name { font-weight: 700; color: #111827; }
    .card .meta { font-size: 0.72rem; color: #6B7280; margin-top: 2px; }
    .card .actions { margin-top: 6px; display: flex; gap: 4px; }
    .card .actions button { font-size: 0.68rem; padding: 2px 8px; border: 1px solid #E5E7EB; border-radius: 4px; background: #fff; cursor: pointer; }
    .card .actions button:hover { background: #F3F4F6; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); z-index: 100; justify-content: center; align-items: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 24px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
    .modal h2 { margin-bottom: 16px; font-size: 1.1rem; }
    .modal label { display: block; font-size: 0.8rem; font-weight: 600; margin: 12px 0 4px; color: #374151; }
    .modal input, .modal textarea, .modal select { width: 100%; padding: 8px 12px; border: 1px solid #D1D5DB; border-radius: 6px; font-size: 0.85rem; }
    .modal textarea { min-height: 80px; resize: vertical; }
    .modal .btns { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
    .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; color: #fff; font-weight: 600; font-size: 0.85rem; z-index: 200; display: none; }
    .toast.success { background: #16A34A; display: block; }
    .toast.error { background: #DC2626; display: block; }
    .empty { text-align: center; color: #9CA3AF; padding: 24px; font-size: 0.85rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #E5E7EB; }
    th { font-weight: 700; color: #6B7280; font-size: 0.75rem; text-transform: uppercase; }
  </style>
</head>
<body>
<div class="topbar">
  <h1>CareDesk Marketing</h1>
  <div class="stats" id="stats"></div>
</div>

<div class="controls">
  <button class="primary" onclick="runScrape()">Scrape CQC</button>
  <button class="primary" onclick="enrichBulk()">Enrich Contacts</button>
  <button class="warn" onclick="runCampaign('enriched','intro')">Send Intro</button>
  <button class="warn" onclick="runCampaign('contacted','follow_up')">Send Follow-up</button>
  <button class="danger" onclick="runCampaign('replied','evidence_pack')">Send Evidence</button>
  <select id="statusFilter" onchange="loadLeads()">
    <option value="all">All Statuses</option>
    <option value="new">New</option>
    <option value="enriched">Enriched</option>
    <option value="contacted">Contacted</option>
    <option value="replied">Replied</option>
    <option value="demo_booked">Demo Booked</option>
    <option value="won">Won</option>
    <option value="lost">Lost</option>
  </select>
  <input type="text" id="searchInput" placeholder="Search providers..." oninput="loadLeads()">
  <button onclick="seedTemplates()">Seed Templates</button>
</div>

<div class="pipeline" id="pipeline"></div>

<div class="modal-overlay" id="modal">
  <div class="modal" id="modalContent"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = '/api'

async function loadAll() { loadLeads(); loadStats() }
async function loadStats() {
  const r = await fetch(API+'/stats').then(d=>d.json())
  document.getElementById('stats').innerHTML = `
    <span>Leads <strong>${r.total}</strong></span>
    <span>Sent <strong>${r.emailStats.sent}</strong></span>
    <span>Opened <strong>${r.emailStats.opened}</strong> (${r.emailStats.openRate}%)</span>
    <span>Clicked <strong>${r.emailStats.clicked}</strong></span>
  `
}

async function loadLeads() {
  const status = document.getElementById('statusFilter').value
  const search = document.getElementById('searchInput').value
  const r = await fetch(API+`/leads?status=${status}&search=${encodeURIComponent(search)}`).then(d=>d.json())
  const cols = { new:[], enriched:[], contacted:[], replied:[], demo_booked:[], won:[], lost:[], skipped:[] }
  r.forEach(l => { if (cols[l.status]) cols[l.status].push(l) })
  const html = Object.entries(cols).map(([s, leads]) => `
    <div class="column">
      <h3>${s.replace(/_/g,' ')} (${leads.length})</h3>
      ${leads.length===0?'<div class="empty">Empty</div>':leads.map(l=>`
        <div class="card" onclick="openLead(${l.id})">
          <div class="name">${l.provider_name||'Unknown'}</div>
          <div class="meta">${l.postcode||''} ${l.cqc_rating?`· ${l.cqc_rating}`:''}</div>
          <div class="meta">${l.contact_name||'No contact'} ${l.contact_email||''}</div>
          <div class="actions" onclick="event.stopPropagation()">
            <button onclick="changeStatus(${l.id},'contacted')">→Contacted</button>
            <button onclick="changeStatus(${l.id},'demo_booked')">→Demo</button>
            <button onclick="changeStatus(${l.id},'won')">→Won</button>
            <button onclick="changeStatus(${l.id},'lost')">→Lost</button>
            <button onclick="sendToOne(${l.id})">✉️</button>
            <button onclick="enrichOne(${l.id})">🔍</button>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('')
  document.getElementById('pipeline').innerHTML = html
}

async function openLead(id) {
  const r = await fetch(API+'/leads?status=all').then(d=>d.json())
  const l = r.find(x=>x.id===id)
  if (!l) return
  const logs = [] // simplified
  document.getElementById('modalContent').innerHTML = `
    <h2>${l.provider_name}</h2>
    <label>Contact Name</label><input value="${l.contact_name||''}" onchange="updateLead(${id},'contact_name',this.value)">
    <label>Contact Email</label><input value="${l.contact_email||''}" onchange="updateLead(${id},'contact_email',this.value)">
    <label>Phone</label><input value="${l.contact_phone||''}" onchange="updateLead(${id},'contact_phone',this.value)">
    <label>Status</label><select onchange="updateLead(${id},'status',this.value);loadLeads()">
      ${['new','enriched','contacted','replied','demo_booked','won','lost','skipped'].map(s=>`<option ${l.status===s?'selected':''}>${s}</option>`).join('')}
    </select>
    <label>Notes</label><textarea onchange="updateLead(${id},'notes',this.value)">${l.notes||''}</textarea>
    <div style="font-size:0.75rem;color:#6B7280;margin-top:8px">CQC Rating: ${l.cqc_rating||'N/A'} · Type: ${l.service_type||'N/A'} · Last Inspected: ${l.last_inspection||'N/A'}</div>
    <div class="btns">
      <button onclick="deleteLead(${id})" style="background:#fee2e2;color:#991b1b;border:none;padding:6px 14px;border-radius:6px;cursor:pointer">Delete</button>
      <button onclick="document.getElementById('modal').classList.remove('active')">Close</button>
    </div>
  `
  document.getElementById('modal').classList.add('active')
}

async function changeStatus(id, status) { await fetch(API+'/leads/'+id, {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})}); loadLeads() }
async function updateLead(id, field, value) { await fetch(API+'/leads/'+id, {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({[field]:value})}) }
async function deleteLead(id) { await fetch(API+'/leads/'+id, {method:'DELETE'}); document.getElementById('modal').classList.remove('active'); loadLeads() }
async function sendToOne(id) { toast('Sending...'); const r=await fetch(API+'/send-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({leadId:id,template:'intro'})}); toast(r.ok?'Sent!':'Failed'); loadLeads() }
async function enrichOne(id) { toast('Enriching...'); const r=await fetch(API+'/enrich/'+id,{method:'POST'}); toast(r.ok?'Contact found!':'No contact found'); loadLeads() }
async function runScrape() { toast('Scraping CQC...'); const r=await fetch(API+'/scrape',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({limit:50})}); const d=await r.json(); toast(`Found ${d.total}, added ${d.added} new`); loadLeads() }
async function enrichBulk() { toast('Enriching...'); const r=await fetch(API+'/enrich-bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'new',limit:20})}); const d=await r.json(); toast(`Enriched ${d.found}/${d.attempted}`); loadLeads() }
async function runCampaign(stage, template) { toast('Sending campaign...'); const r=await fetch(API+'/send-campaign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage,template,limit:10})}); const d=await r.json(); toast(`Sent ${d.sent}, failed ${d.failed}`); loadLeads() }
async function seedTemplates() { await fetch(API+'/seed-templates',{method:'POST'}); toast('Templates seeded') }

function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.className='toast success'; setTimeout(()=>t.className='toast',2500) }

document.getElementById('modal').addEventListener('click',e=>{ if(e.target===document.getElementById('modal')) document.getElementById('modal').classList.remove('active') })
loadAll()
</script>
</body>
</html>
