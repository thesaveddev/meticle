# Security headers, in one place.
#
# This file exists because of a nginx behaviour that is easy to miss: add_header
# directives are NOT merged across levels. A location block that declares any
# add_header of its own REPLACES the entire inherited set from the server block,
# silently discarding everything declared there.
#
# Four location blocks need their own Cache-Control (the immutable hashed assets,
# and the no-store entries for index.html, sw.js and the web manifest), so all
# four were dropping the security headers. In production the only headers a
# visitor actually received came from Cloudflare's edge defaults — the CSP
# configured in nginx never reached a browser.
#
# Any block that declares add_header must therefore `include` this file. That is
# why it is included in the server block and again in each of those locations,
# rather than relying on inheritance.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# The allowlist maps what this application genuinely loads: Google Fonts for
# typography, OpenStreetMap tiles and Nominatim geocoding for the visit map, and
# the same-origin Socket.io channel for chat. style-src allows inline because
# MUI's emotion inserts styles at runtime; script-src does not, because nothing
# in the built bundle needs it.
#
# upgrade-insecure-requests is deliberately absent: it is only meaningful when
# TLS terminates at this host, and here it terminates at Cloudflare, so the
# directive would add nothing.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://a.tile.openstreetmap.org; connect-src 'self' wss: https://nominatim.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self), payment=()" always;
