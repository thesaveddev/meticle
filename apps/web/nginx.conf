server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers.
    #
    # HSTS tells a browser to refuse plain HTTP for this host for a year. TLS
    # terminates at Cloudflare, but the header still applies to the visitor's
    # connection, so it belongs here. preload is deliberately omitted: it is not
    # reversible and should only be sent once you are certain every subdomain is
    # HTTPS-only.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self), payment=()" always;

    # Content security policy. The allowlist is not decorative — it maps what
    # this application genuinely loads: Google Fonts for typography, OpenStreetMap
    # tiles and Nominatim geocoding for the visit map, and the same-origin
    # Socket.io channel for chat. MUI's emotion inserts styles at runtime, which
    # is why style-src allows inline; script-src does not, because nothing in the
    # built bundle needs it.
    #
    # object-src and base-uri are set because they close off plugin content and
    # base-tag injection, and frame-ancestors restates X-Frame-Options in a form
    # CSP enforces consistently.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://a.tile.openstreetmap.org; connect-src 'self' wss: https://nominatim.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable — cache aggressively.
    #
    # The security headers are repeated here deliberately. nginx's add_header
    # REPLACES the inherited set rather than merging with it, so a location
    # block that declares any add_header of its own drops every header from the
    # server block. Declaring Cache-Control alone therefore silently removed
    # HSTS, the CSP and the rest from every hashed JS and CSS file.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://a.tile.openstreetmap.org; connect-src 'self' wss: https://nominatim.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests" always;
    }

    # index.html + service worker must always revalidate to avoid stale-bundle issues
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location /api/ {
        proxy_pass http://api:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io/ {
        proxy_pass http://api:3002/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /files/ {
        proxy_pass http://api:3002/files/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    client_max_body_size 15m;
}
