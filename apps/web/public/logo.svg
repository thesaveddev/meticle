<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <!-- Interlocking arcs 'M' mark -->
  <g transform="translate(10, 10)">
    <!-- Left arc (care/protection swoop) -->
    <path d="M0 80 C0 30 20 10 50 10 C80 10 100 30 100 80" stroke="#0F4C81" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Right arc (metric/precision swoop) -->
    <path d="M100 80 C100 30 80 10 50 10 C20 10 0 30 0 80" stroke="#3B82F6" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Connecting bridge - forms the M -->
    <path d="M30 80 L50 30 L70 80" stroke="#0F4C81" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Wordmark -->
  <text x="140" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="900" font-size="40" fill="#0F4C81" letter-spacing="-1">Meticle</text>
  <!-- Tagline -->
  <text x="142" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="600" font-size="14" fill="#6B7280" letter-spacing="0.3">Care operations, unified.</text>
</svg>
