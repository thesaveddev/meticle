<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F4C81"/>
      <stop offset="100%" stop-color="#0A3559"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="500" rx="24" fill="url(#bg)"/>

  <!-- Floating elements -->
  <circle cx="80" cy="80" r="40" fill="url(#primary)" opacity="0.06"/>
  <circle cx="540" cy="420" r="60" fill="url(#accent)" opacity="0.06"/>
  <circle cx="500" cy="100" r="24" fill="url(#primary)" opacity="0.08"/>

  <!-- Dashboard mockup frame -->
  <rect x="60" y="60" width="480" height="320" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 8px 24px rgba(15,76,129,0.08))"/>

  <!-- Dashboard header -->
  <rect x="60" y="60" width="480" height="56" rx="16" fill="url(#primary)"/>
  <rect x="60" y="100" width="480" height="16" fill="url(#primary)"/>

  <!-- Logo text in header -->
  <text x="96" y="96" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="20" fill="white" letter-spacing="-0.5">Meticle</text>

  <!-- Dashboard content three cards -->
  <rect x="84" y="136" width="130" height="90" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="84" y="136" width="130" height="4" rx="2" fill="url(#accent)"/>
  <circle cx="108" cy="168" r="14" fill="#DBEAFE"/>
  <path d="M103 168l4 4 8-8" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="108" y="216" font-family="system-ui,sans-serif" font-weight="700" font-size="16" fill="#0F4C81" text-anchor="middle">98%</text>
  <text x="108" y="228" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Compliance</text>

  <rect x="235" y="136" width="130" height="90" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="235" y="136" width="130" height="4" rx="2" fill="#10B981"/>
  <text x="300" y="180" font-family="system-ui,sans-serif" font-weight="700" font-size="16" fill="#0F4C81" text-anchor="middle">12</text>
  <text x="300" y="196" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Staff On Shift</text>
  <text x="300" y="210" font-family="system-ui,sans-serif" font-size="9" fill="#10B981" text-anchor="middle">Fully staffed</text>

  <rect x="386" y="136" width="130" height="90" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="386" y="136" width="130" height="4" rx="2" fill="#F59E0B"/>
  <text x="451" y="180" font-family="system-ui,sans-serif" font-weight="700" font-size="16" fill="#0F4C81" text-anchor="middle">5</text>
  <text x="451" y="196" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Pending Reviews</text>
  <text x="451" y="210" font-family="system-ui,sans-serif" font-size="9" fill="#F59E0B" text-anchor="middle">Requires attention</text>

  <!-- Rota timeline strip -->
  <rect x="84" y="244" width="432" height="48" rx="8" fill="#F1F5F9"/>
  <rect x="92" y="252" width="60" height="32" rx="6" fill="url(#accent)" opacity="0.15"/>
  <text x="100" y="272" font-family="system-ui,sans-serif" font-size="9" fill="#2563EB" font-weight="600">Day</text>
  <rect x="160" y="252" width="60" height="32" rx="6" fill="#E2E8F0"/>
  <text x="168" y="272" font-family="system-ui,sans-serif" font-size="9" fill="#64748B">Night</text>
  <rect x="228" y="252" width="60" height="32" rx="6" fill="#E2E8F0"/>
  <text x="236" y="272" font-family="system-ui,sans-serif" font-size="9" fill="#64748B">Sleep</text>
  <rect x="296" y="252" width="60" height="32" rx="6" fill="#E2E8F0"/>
  <text x="304" y="272" font-family="system-ui,sans-serif" font-size="9" fill="#64748B">Day</text>
  <rect x="364" y="252" width="60" height="32" rx="6" fill="#E2E8F0"/>
  <text x="372" y="272" font-family="system-ui,sans-serif" font-size="9" fill="#64748B">Day</text>
  <rect x="440" y="252" width="60" height="32" rx="6" fill="#E2E8F0"/>
  <text x="448" y="272" font-family="system-ui,sans-serif" font-size="9" fill="#64748B">Night</text>

  <!-- Trust badges -->
  <rect x="84" y="310" width="130" height="30" rx="6" fill="#ECFDF5"/>
  <path d="M96 325l4 4 8-8" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="329" font-family="system-ui,sans-serif" font-size="10" fill="#059669" font-weight="600">CQC Aligned</text>

  <rect x="230" y="310" width="130" height="30" rx="6" fill="#EFF6FF"/>
  <text x="256" y="329" font-family="system-ui,sans-serif" font-size="10" fill="#2563EB" font-weight="600">GDPR Compliant</text>

  <rect x="376" y="310" width="140" height="30" rx="6" fill="#FFF7ED"/>
  <text x="406" y="329" font-family="system-ui,sans-serif" font-size="10" fill="#EA580C" font-weight="600">Cyber Essentials</text>

  <!-- Bottom tagline -->
  <text x="300" y="430" font-family="system-ui,sans-serif" font-weight="600" font-size="14" fill="#0F4C81" text-anchor="middle">Staffing &amp; compliance, unified.</text>
  <text x="300" y="452" font-family="system-ui,sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">The care home management platform</text>

  <!-- Decorative dots -->
  <circle cx="520" cy="180" r="3" fill="#0F4C81" opacity="0.12"/>
  <circle cx="530" cy="200" r="2" fill="#0F4C81" opacity="0.08"/>
  <circle cx="100" cy="380" r="2" fill="#0F4C81" opacity="0.1"/>
</svg>
