<!doctype html><meta charset="utf-8"><title>Visual baseline review</title><style>body{font:14px system-ui;margin:16px;background:#eee}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}.row img{width:100%;height:auto;background:white;border:1px solid #aaa}.label{position:sticky;top:0;background:#222;color:white;padding:6px}</style><h1>Marketing visual delta review</h1><div id="app"></div><script>for(const route of ['home','pricing','login']){const h=document.createElement('h2');h.textContent=route;document.querySelector('#app').append(h);const row=document.createElement('div');row.className='row';for(const kind of ['baseline','actual','diff']){const box=document.createElement('div');box.innerHTML=`<div class="label">${kind}</div><img src="${route}-${kind}.png">`;row.append(box)}document.querySelector('#app').append(row)}</script>
