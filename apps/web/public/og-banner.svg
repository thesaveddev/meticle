<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F4C81"/>
      <stop offset="100%" stop-color="#0A3A63"/>
    </linearGradient>
    <linearGradient id="ogPillar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ogAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F4EE"/>
      <stop offset="100%" stop-color="#E7E1D6"/>
    </linearGradient>
    <pattern id="ogDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogDots)"/>

  <!-- Right accent band -->
  <rect x="780" y="0" width="420" height="630" fill="#0A3A63"/>

  <!-- Wordmark device -->
  <g transform="translate(80 80)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#FFFFFF"/>
    <path d="M14 36 V14 L22 24 L30 14 V36" stroke="#0F4C81" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="30" cy="14" r="3.4" fill="#10B981"/>
    <text x="60" y="34" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">Meticle</text>
    <text x="246" y="34" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="44" font-weight="900" fill="#10B981" letter-spacing="-1.5">Care</text>
  </g>

  <!-- Tagline -->
  <text x="80" y="280" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="62" font-weight="900" fill="#FFFFFF" letter-spacing="-2">Care operations,</text>
  <text x="80" y="346" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="62" font-weight="900" fill="#FFFFFF" letter-spacing="-2">unified.</text>

  <text x="80" y="404" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="22" fill="#FFFFFF" fill-opacity="0.78" font-weight="500">Care planning · Staff rotas · Medication</text>
  <text x="80" y="434" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="22" fill="#FFFFFF" fill-opacity="0.78" font-weight="500">Compliance · Incidents — in one platform.</text>

  <!-- Regulator chips -->
  <g transform="translate(80 484)">
    <rect x="0" y="0" width="84" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="42" y="21" text-anchor="middle" fill="#FFFFFF" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800">CQC</text>
    <rect x="96" y="0" width="84" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="138" y="21" text-anchor="middle" fill="#FFFFFF" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800">CIW</text>
    <rect x="192" y="0" width="84" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="234" y="21" text-anchor="middle" fill="#FFFFFF" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800">CIS</text>
    <rect x="288" y="0" width="84" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="330" y="21" text-anchor="middle" fill="#FFFFFF" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800">RQIA</text>
    <rect x="384" y="0" width="120" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="444" y="21" text-anchor="middle" fill="#FFFFFF" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800">UK GDPR · DSPT</text>
  </g>

  <!-- URL -->
  <text x="80" y="566" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="20" fill="#10B981" font-weight="700">meticlecare.com</text>

  <!-- Right-side illustration: a tablet with eMAR + care note -->
  <g transform="translate(844 90)">
    <rect x="0" y="0" width="340" height="450" rx="22" fill="#FFFFFF"/>
    <rect x="0" y="0" width="340" height="56" rx="22" fill="#0F4C81"/>
    <rect x="0" y="34" width="340" height="22" fill="#0F4C81"/>
    <rect x="20" y="18" width="22" height="22" rx="5" fill="#FFFFFF"/>
    <path d="M26 32 V22 L31 28 L36 22 V32" stroke="#0F4C81" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="52" y="34" fill="#FFFFFF" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="800">MeticleCare</text>
    <circle cx="318" cy="28" r="5" fill="#10B981"/>
    <!-- body -->
    <g transform="translate(20 76)">
      <!-- Person header -->
      <rect x="0" y="0" width="300" height="56" rx="12" fill="#F7F4EE"/>
      <circle cx="32" cy="28" r="18" fill="#10B981"/>
      <text x="32" y="34" text-anchor="middle" fill="#FFFFFF" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="800">EM</text>
      <text x="60" y="24" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800">Eleanor M. · Room 4</text>
      <text x="60" y="40" fill="#5B6672" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11">Today's plan · 4 of 6 done</text>
      <!-- Care note -->
      <rect x="0" y="72" width="300" height="120" rx="12" fill="#FFFFFF" stroke="#E7E1D6"/>
      <text x="14" y="92" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="800">11:24 care note</text>
      <text x="14" y="112" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600">"A calm morning — Eleanor enjoyed</text>
      <text x="14" y="128" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600">her walk, asked about the kittens."</text>
      <rect x="14" y="148" width="68" height="20" rx="10" fill="#10B981" fill-opacity="0.14"/>
      <text x="48" y="161" text-anchor="middle" fill="#047857" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="800">Wellbeing</text>
      <text x="288" y="161" text-anchor="end" fill="#0F4C81" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="800">Saved · 2 viewed</text>
      <!-- MAR mini -->
      <g transform="translate(0 208)">
        <text x="0" y="12" fill="#5B6672" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">eMAR · 14 DAYS</text>
        <g transform="translate(0 22)">
          <rect x="0" y="0" width="18" height="22" rx="3" fill="#10B981"/>
          <rect x="22" y="0" width="18" height="22" rx="3" fill="#10B981"/>
          <rect x="44" y="0" width="18" height="22" rx="3" fill="#10B981"/>
          <rect x="66" y="0" width="18" height="22" rx="3" fill="#10B981"/>
          <rect x="88" y="0" width="18" height="22" rx="3" fill="#10B981"/>
          <rect x="110" y="0" width="18" height="22" rx="3" fill="#10B981"/>
          <rect x="132" y="0" width="18" height="22" rx="3" fill="#10B981"/>
          <rect x="154" y="0" width="18" height="22" rx="3" fill="#10B981"/>
          <rect x="176" y="0" width="18" height="22" rx="3" fill="#10B981"/>
          <rect x="198" y="0" width="18" height="22" rx="3" fill="#0F4C81"/>
          <rect x="220" y="0" width="18" height="22" rx="3" fill="#0F4C81"/>
          <rect x="242" y="0" width="18" height="22" rx="3" fill="none" stroke="#C9C2B4" stroke-dasharray="2 2"/>
          <rect x="264" y="0" width="18" height="22" rx="3" fill="none" stroke="#C9C2B4" stroke-dasharray="2 2"/>
          <rect x="286" y="0" width="14" height="22" rx="3" fill="none" stroke="#C9C2B4" stroke-dasharray="2 2"/>
        </g>
      </g>
      <!-- Footer signature -->
      <g transform="translate(0 268)">
        <circle cx="10" cy="10" r="10" fill="#0F4C81"/>
        <text x="10" y="14" text-anchor="middle" fill="#FFFFFF" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="800">SC</text>
        <text x="28" y="14" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700">Sam Carter · 11:24</text>
      </g>
    </g>
  </g>

  <!-- Bottom-right tag -->
  <g transform="translate(844 564)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#10B981"/>
    <text x="20" y="11" fill="#FFFFFF" fill-opacity="0.7" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600">For supported living · Domiciliary care</text>
  </g>
</svg>
