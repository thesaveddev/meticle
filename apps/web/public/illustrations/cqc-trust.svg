<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 200" preserveAspectRatio="xMidYMid meet" fill="none" role="img" aria-label="Trust strip: MeticleCare is built for the four UK care regulators — CQC, CIW, Care Inspectorate, RQIA — and to UK GDPR, DPA 2018 and DSPT standards">
  <defs>
    <linearGradient id="ctBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F4EE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="200" fill="url(#ctBg)"/>

  <!-- CQC -->
  <g transform="translate(120 60)">
    <rect x="0" y="0" width="200" height="80" rx="12" fill="#FFFFFF" stroke="#E7E1D6"/>
    <circle cx="36" cy="40" r="22" fill="#0F4C81"/>
    <text x="36" y="46" text-anchor="middle" fill="#FFFFFF" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="900">CQC</text>
    <text x="68" y="34" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800">Care Quality</text>
    <text x="68" y="50" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800">Commission</text>
    <text x="68" y="64" fill="#5B6672" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="500">England · 5 KLOEs</text>
  </g>

  <!-- CIW -->
  <g transform="translate(348 60)">
    <rect x="0" y="0" width="200" height="80" rx="12" fill="#FFFFFF" stroke="#E7E1D6"/>
    <circle cx="36" cy="40" r="22" fill="#10B981"/>
    <text x="36" y="46" text-anchor="middle" fill="#FFFFFF" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="900">CIW</text>
    <text x="68" y="34" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800">Care Inspectorate</text>
    <text x="68" y="50" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800">Wales</text>
    <text x="68" y="64" fill="#5B6672" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="500">CIW framework</text>
  </g>

  <!-- Care Inspectorate Scotland -->
  <g transform="translate(576 60)">
    <rect x="0" y="0" width="220" height="80" rx="12" fill="#FFFFFF" stroke="#E7E1D6"/>
    <circle cx="36" cy="40" r="22" fill="#0F4C81"/>
    <text x="36" y="46" text-anchor="middle" fill="#FFFFFF" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="900">CIS</text>
    <text x="68" y="34" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800">Care Inspectorate</text>
    <text x="68" y="50" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800">Scotland</text>
    <text x="68" y="64" fill="#5B6672" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="500">Health & social care</text>
  </g>

  <!-- RQIA -->
  <g transform="translate(824 60)">
    <rect x="0" y="0" width="200" height="80" rx="12" fill="#FFFFFF" stroke="#E7E1D6"/>
    <circle cx="36" cy="40" r="22" fill="#10B981"/>
    <text x="36" y="46" text-anchor="middle" fill="#FFFFFF" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="900">RQIA</text>
    <text x="68" y="34" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800">NI Regulator</text>
    <text x="68" y="50" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800">Quality & Improvement</text>
    <text x="68" y="64" fill="#5B6672" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="500">Northern Ireland</text>
  </g>

  <!-- UK GDPR pill -->
  <g transform="translate(1052 60)">
    <rect x="0" y="0" width="108" height="80" rx="12" fill="#FFFFFF" stroke="#E7E1D6"/>
    <path d="M40 22 L40 58 M30 30 L40 22 L50 30 M28 56 L40 64 L52 56" stroke="#0F4C81" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="74" y="38" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="800">UK GDPR</text>
    <text x="74" y="52" fill="#5B6672" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="500">DPA 2018</text>
    <text x="74" y="64" fill="#5B6672" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="500">DSPT</text>
  </g>
</svg>
