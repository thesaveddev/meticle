<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Care Moment Mobile Illustration -->
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="phone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2430"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg2)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="400" r="200" fill="#10B981" opacity="0.05"/>
  <circle cx="700" cy="100" r="150" fill="#0F4C81" opacity="0.05"/>
  
  <!-- Phone Mockup -->
  <g filter="url(#shadow2)" transform="translate(300, 40)">
    <!-- Phone Frame -->
    <rect x="0" y="0" width="200" height="400" rx="24" fill="url(#phone)"/>
    <rect x="8" y="8" width="184" height="384" rx="20" fill="white"/>
    
    <!-- Status Bar -->
    <rect x="8" y="8" width="184" height="40" rx="20" fill="#F8FAFC"/>
    <rect x="8" y="28" width="184" height="20" fill="#F8FAFC"/>
    <text x="24" y="24" font-family="Arial, sans-serif" font-weight="600" font-size="10" fill="#1B2430">9:41</text>
    <circle cx="170" cy="24" r="6" fill="#10B981"/>
    <text x="170" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="6" fill="white">✓</text>
    
    <!-- App Header -->
    <rect x="8" y="48" width="184" height="44" fill="#0F4C81"/>
    <text x="24" y="68" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="white">Daily Care Note</text>
    <text x="24" y="84" font-family="Arial, sans-serif" font-weight="400" font-size="9" fill="white" opacity="0.8">John Smith — Room 4</text>
    
    <!-- Person Card -->
    <rect x="16" y="100" width="168" height="48" rx="8" fill="#F8FAFC" stroke="#E5E7EB"/>
    <circle cx="36" cy="124" r="14" fill="#E0F2FE"/>
    <text x="36" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#0F4C81">JS</text>
    <text x="58" y="118" font-family="Arial, sans-serif" font-weight="600" font-size="10" fill="#1B2430">John Smith</text>
    <text x="58" y="132" font-family="Arial, sans-serif" font-weight="400" font-size="8" fill="#5B6672">Room 4 · Age 72</text>
    <rect x="148" y="114" width="28" height="16" rx="4" fill="#10B981"/>
    <text x="162" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="7" fill="white">Active</text>
    
    <!-- Care Note Input -->
    <rect x="16" y="156" width="168" height="80" rx="8" fill="white" stroke="#E5E7EB"/>
    <text x="28" y="176" font-family="Arial, sans-serif" font-weight="600" font-size="9" fill="#5B6672">What happened today?</text>
    <text x="28" y="194" font-family="Arial, sans-serif" font-weight="400" font-size="9" fill="#1B2430">John had a good morning. He</text>
    <text x="28" y="208" font-family="Arial, sans-serif" font-weight="400" font-size="9" fill="#1B2430">enjoyed breakfast and took all</text>
    <text x="28" y="222" font-family="Arial, sans-serif" font-weight="400" font-size="9" fill="#1B2430">his medication. He went for a</text>
    <rect x="140" y="218" width="2" height="12" fill="#0F4C81">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Quick Actions -->
    <rect x="16" y="244" width="52" height="32" rx="6" fill="#FEF3C7"/>
    <text x="42" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="8" fill="#92400E">💊 Meds</text>
    <rect x="76" y="244" width="52" height="32" rx="6" fill="#E0F2FE"/>
    <text x="102" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="8" fill="#0284C7">💧 Fluid</text>
    <rect x="136" y="244" width="48" height="32" rx="6" fill="#FEE2E2"/>
    <text x="160" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="8" fill="#991B1B">📸 Photo</text>
    
    <!-- Submit Button -->
    <rect x="16" y="288" width="168" height="36" rx="8" fill="#10B981"/>
    <text x="100" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="white">Save Note</text>
    
    <!-- Bottom Nav -->
    <rect x="8" y="340" width="184" height="52" rx="20" fill="#F8FAFC"/>
    <text x="32" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="8" fill="#5B6672">Home</text>
    <text x="80" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="8" fill="#0F4C81">Notes</text>
    <text x="128" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="8" fill="#5B6672">Tasks</text>
    <text x="172" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="8" fill="#5B6672">More</text>
    <circle cx="80" cy="374" r="2" fill="#0F4C81"/>
  </g>
  
  <!-- Floating Elements -->
  <!-- Success Notification -->
  <g transform="translate(580, 120)">
    <rect x="-80" y="-20" width="160" height="40" rx="8" fill="white" filter="url(#shadow2)"/>
    <circle cx="-60" cy="0" r="12" fill="#10B981"/>
    <text x="-60" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="white">✓</text>
    <text x="-40" y="-4" font-family="Arial, sans-serif" font-weight="600" font-size="10" fill="#1B2430">Note saved!</text>
    <text x="-40" y="10" font-family="Arial, sans-serif" font-weight="400" font-size="8" fill="#5B6672">Shared with manager</text>
  </g>
  
  <!-- Family Update -->
  <g transform="translate(600, 220)">
    <rect x="-90" y="-24" width="180" height="48" rx="8" fill="white" filter="url(#shadow2)"/>
    <circle cx="-70" cy="0" r="14" fill="#FEE2E2"/>
    <text x="-70" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">👨‍👩‍👧</text>
    <text x="-48" y="-6" font-family="Arial, sans-serif" font-weight="600" font-size="9" fill="#1B2430">Family notified</text>
    <text x="-48" y="8" font-family="Arial, sans-serif" font-weight="400" font-size="8" fill="#5B6672">Sarah received the update</text>
  </g>
  
  <!-- Compliance Badge -->
  <g transform="translate(140, 120)">
    <rect x="-50" y="-20" width="100" height="40" rx="8" fill="white" filter="url(#shadow2)"/>
    <text x="0" y="-4" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="9" fill="#1B2430">Compliance</text>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#10B981">94%</text>
  </g>
  
  <!-- Floating Hearts -->
  <g transform="translate(100, 350)">
    <circle cx="0" cy="0" r="20" fill="#FEE2E2" opacity="0.6"/>
    <path d="M-6,-3 C-6,-6 -3,-7 0,-4 C3,-7 6,-6 6,-3 C6,0 0,5 0,5 C0,5 -6,0 -6,-3Z" fill="#EF4444" opacity="0.8"/>
  </g>
  
  <g transform="translate(650, 380)">
    <circle cx="0" cy="0" r="16" fill="#DCFCE7" opacity="0.6"/>
    <path d="M-5,-2 C-5,-5 -2,-6 0,-3 C2,-6 5,-5 5,-2 C5,0 0,4 0,4 C0,4 -5,0 -5,-2Z" fill="#10B981" opacity="0.8"/>
  </g>
</svg>
