<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice" fill="none" role="img" aria-label="Mobile view of a daily care note being recorded in MeticleCare, with family and manager avatars receiving the update">
  <defs>
    <linearGradient id="cmBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F4EE"/>
      <stop offset="100%" stop-color="#EFE8DA"/>
    </linearGradient>
    <linearGradient id="cmPhone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4EFE2"/>
    </linearGradient>
    <linearGradient id="cmNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F4C81"/>
      <stop offset="100%" stop-color="#0A3A63"/>
    </linearGradient>
    <pattern id="cmDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0F4C81" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="800" fill="url(#cmBg)"/>
  <rect width="1280" height="800" fill="url(#cmDots)"/>
  <circle cx="160" cy="180" r="180" fill="#10B981" fill-opacity="0.06"/>
  <circle cx="1100" cy="640" r="220" fill="#0F4C81" fill-opacity="0.06"/>

  <!-- Phone frame -->
  <g transform="translate(120 100)">
    <rect x="14" y="20" width="380" height="640" rx="46" fill="#1B2430" fill-opacity="0.2"/>
    <rect x="0" y="0" width="380" height="640" rx="42" fill="url(#cmPhone)" stroke="#E0D9CA" stroke-width="1.5"/>
    <rect x="20" y="20" width="340" height="600" rx="32" fill="#FFFFFF" stroke="#E7E1D6"/>
    <!-- Status bar -->
    <rect x="160" y="32" width="60" height="14" rx="7" fill="#1B2430" fill-opacity="0.7"/>
    <!-- App header -->
    <rect x="20" y="60" width="340" height="64" fill="url(#cmNavy)"/>
    <rect x="32" y="74" width="22" height="22" rx="5" fill="#FFFFFF"/>
    <path d="M37 88 V78 L43 84 L49 78 V88" stroke="#0F4C81" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="62" y="92" fill="#FFFFFF" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="800">MeticleCare</text>
    <circle cx="338" cy="86" r="9" fill="#10B981"/>
    <path d="M334 86 L337 89 L342 83" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="338" y="115" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.7" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="9" font-weight="600">Connected</text>

    <!-- Date row -->
    <text x="42" y="148" fill="#5B6672" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">TODAY · 14 AUG</text>

    <!-- Person header -->
    <rect x="36" y="166" width="308" height="64" rx="14" fill="#F7F4EE"/>
    <circle cx="68" cy="198" r="22" fill="url(#cmNavy)"/>
    <text x="68" y="204" text-anchor="middle" fill="#FFFFFF" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="16" font-weight="800">EM</text>
    <text x="100" y="194" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="800">Eleanor M.</text>
    <text x="100" y="210" fill="#5B6672" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="500">Room 4 · Care in progress</text>
    <rect x="262" y="186" width="68" height="22" rx="11" fill="#10B981" fill-opacity="0.15"/>
    <text x="296" y="201" text-anchor="middle" fill="#047857" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="800">On shift</text>

    <!-- Care note input card -->
    <rect x="36" y="246" width="308" height="170" rx="14" fill="#FFFFFF" stroke="#E7E1D6"/>
    <text x="48" y="270" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="800">Today's care note</text>
    <text x="48" y="294" fill="#5B6672" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11">07:42 · Sam Carter</text>
    <line x1="48" y1="304" x2="332" y2="304" stroke="#E7E1D6"/>
    <text x="48" y="328" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="500">"Eleanor was cheerful at breakfast —</text>
    <text x="48" y="346" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="500">enjoyed her porridge and asked</text>
    <text x="48" y="364" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="500">about the kittens again."</text>
    <line x1="48" y1="380" x2="332" y2="380" stroke="#E7E1D6"/>
    <rect x="48" y="390" width="76" height="20" rx="10" fill="#10B981" fill-opacity="0.12"/>
    <text x="86" y="404" text-anchor="middle" fill="#047857" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="800">Wellbeing</text>
    <text x="332" y="404" text-anchor="end" fill="#0F4C81" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="800">Save</text>

    <!-- Action row -->
    <rect x="36" y="436" width="148" height="46" rx="12" fill="#FFFFFF" stroke="#E7E1D6"/>
    <circle cx="58" cy="459" r="10" fill="#0F4C81"/>
    <path d="M54 459 L57 462 L62 457" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="74" y="463" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700">Med given</text>
    <rect x="196" y="436" width="148" height="46" rx="12" fill="#0F4C81"/>
    <circle cx="218" cy="459" r="10" fill="#FFFFFF"/>
    <path d="M214 459 L218 463 L226 455" stroke="#0F4C81" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="234" y="463" fill="#FFFFFF" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700">Add note</text>

    <!-- Bottom nav -->
    <rect x="20" y="568" width="340" height="52" rx="0" fill="#FFFFFF" stroke="#E7E1D6"/>
    <line x1="20" y1="568" x2="360" y2="568" stroke="#E7E1D6"/>
    <g transform="translate(60 580)">
      <rect x="-4" y="0" width="40" height="40" rx="10" fill="#0F4C81" fill-opacity="0.08"/>
      <rect x="6" y="14" width="20" height="14" rx="2" stroke="#0F4C81" stroke-width="2" fill="none"/>
      <line x1="6" y1="22" x2="26" y2="22" stroke="#0F4C81" stroke-width="2"/>
    </g>
    <g transform="translate(150 580)">
      <rect x="-4" y="0" width="40" height="40" rx="10" fill="none"/>
      <circle cx="16" cy="20" r="9" stroke="#5B6672" stroke-width="2" fill="none"/>
      <path d="M16 11 V20 L22 23" stroke="#5B6672" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
    <g transform="translate(240 580)">
      <rect x="-4" y="0" width="40" height="40" rx="10" fill="none"/>
      <path d="M9 13 L23 13 L23 28 L9 28 Z M9 13 L16 21 L23 13" stroke="#5B6672" stroke-width="2" fill="none" stroke-linejoin="round"/>
    </g>
    <g transform="translate(330 580)">
      <rect x="-4" y="0" width="40" height="40" rx="10" fill="none"/>
      <circle cx="13" cy="20" r="6" stroke="#5B6672" stroke-width="2" fill="none"/>
      <path d="M19 26 C 19 22 23 20 26 20 C 23 20 19 22 19 26" stroke="#5B6672" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Family/manager receiving bubbles -->
  <g transform="translate(580 220)">
    <rect x="0" y="0" width="240" height="84" rx="16" fill="#FFFFFF" stroke="#E7E1D6"/>
    <circle cx="28" cy="42" r="20" fill="url(#cmNavy)"/>
    <text x="28" y="48" text-anchor="middle" fill="#FFFFFF" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="800">SC</text>
    <text x="58" y="36" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800">Sam Carter · Care Worker</text>
    <text x="58" y="52" fill="#5B6672" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11">Wrote Eleanor's care note · 07:42</text>
    <text x="220" y="74" text-anchor="end" fill="#047857" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700">✓ Saved</text>
  </g>

  <g transform="translate(580 380)">
    <rect x="0" y="0" width="240" height="84" rx="16" fill="#FFFFFF" stroke="#E7E1D6"/>
    <circle cx="28" cy="42" r="20" fill="#10B981"/>
    <text x="28" y="48" text-anchor="middle" fill="#FFFFFF" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="800">PJ</text>
    <text x="58" y="36" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800">Pat Jones · Manager</text>
    <text x="58" y="52" fill="#5B6672" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11">Auto-route to MAR + handover</text>
    <rect x="190" y="60" width="38" height="16" rx="8" fill="#10B981" fill-opacity="0.12"/>
    <text x="209" y="72" text-anchor="middle" fill="#047857" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="9" font-weight="800">Live</text>
  </g>

  <g transform="translate(580 540)">
    <rect x="0" y="0" width="240" height="84" rx="16" fill="#FFFFFF" stroke="#E7E1D6"/>
    <circle cx="28" cy="42" r="20" fill="#F2D9C2"/>
    <text x="28" y="48" text-anchor="middle" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="800">SD</text>
    <text x="58" y="36" fill="#1B2430" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="800">Sarah Davies · Daughter</text>
    <text x="58" y="52" fill="#5B6672" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="11">Reads the note in Family Portal</text>
    <text x="220" y="74" text-anchor="end" fill="#0F4C81" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700">2 new →</text>
  </g>

  <!-- Connector lines between phone and bubbles (subtle) -->
  <g opacity="0.4" stroke="#0F4C81" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
    <path d="M520 262 Q 550 262 580 262"/>
    <path d="M520 422 Q 550 422 580 422"/>
    <path d="M520 582 Q 550 582 580 582"/>
  </g>
</svg>
