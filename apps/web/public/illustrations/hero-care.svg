<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Modern Care Dashboard Hero Illustration -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F4C81"/>
      <stop offset="100%" stop-color="#1E6AB0"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F4C81" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="650" cy="100" r="180" fill="#0F4C81" opacity="0.04"/>
  <circle cx="700" cy="150" r="120" fill="#10B981" opacity="0.06"/>
  
  <!-- Main Tablet Dashboard -->
  <g filter="url(#shadow)" transform="translate(180, 40)">
    <!-- Tablet Frame -->
    <rect x="0" y="0" width="440" height="320" rx="16" fill="#1B2430"/>
    <rect x="8" y="8" width="424" height="304" rx="12" fill="url(#card)"/>
    
    <!-- Header Bar -->
    <rect x="8" y="8" width="424" height="48" rx="12" fill="url(#accent)"/>
    <rect x="8" y="36" width="424" height="20" fill="url(#accent)"/>
    <text x="24" y="38" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="white">MeticleCare</text>
    <circle cx="400" cy="32" r="14" fill="white" opacity="0.2"/>
    <circle cx="400" cy="32" r="8" fill="white"/>
    <text x="400" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="8" fill="#0F4C81">JD</text>
    
    <!-- Sidebar -->
    <rect x="8" y="56" width="100" height="256" fill="#F8FAFC"/>
    <rect x="16" y="68" width="84" height="28" rx="6" fill="url(#accent)" opacity="0.1"/>
    <text x="28" y="86" font-family="Arial, sans-serif" font-weight="600" font-size="10" fill="#0F4C81">Dashboard</text>
    <rect x="16" y="104" width="84" height="28" rx="6" fill="transparent"/>
    <text x="28" y="122" font-family="Arial, sans-serif" font-weight="500" font-size="10" fill="#5B6672">People</text>
    <rect x="16" y="140" width="84" height="28" rx="6" fill="transparent"/>
    <text x="28" y="158" font-family="Arial, sans-serif" font-weight="500" font-size="10" fill="#5B6672">Medication</text>
    <rect x="16" y="176" width="84" height="28" rx="6" fill="transparent"/>
    <text x="28" y="194" font-family="Arial, sans-serif" font-weight="500" font-size="10" fill="#5B6672">Daily Notes</text>
    <rect x="16" y="212" width="84" height="28" rx="6" fill="transparent"/>
    <text x="28" y="230" font-family="Arial, sans-serif" font-weight="500" font-size="10" fill="#5B6672">Compliance</text>
    <rect x="16" y="248" width="84" height="28" rx="6" fill="transparent"/>
    <text x="28" y="266" font-family="Arial, sans-serif" font-weight="500" font-size="10" fill="#5B6672">Reports</text>
    
    <!-- Main Content Area -->
    <!-- Welcome Banner -->
    <rect x="116" y="64" width="296" height="40" rx="8" fill="url(#accent)"/>
    <text x="132" y="82" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="white">Good morning, Sarah</text>
    <text x="132" y="96" font-family="Arial, sans-serif" font-weight="400" font-size="9" fill="white" opacity="0.8">3 people need attention today</text>
    
    <!-- Stats Cards -->
    <rect x="116" y="112" width="92" height="56" rx="8" fill="white" stroke="#E5E7EB"/>
    <text x="128" y="132" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#10B981">12</text>
    <text x="128" y="148" font-family="Arial, sans-serif" font-weight="500" font-size="8" fill="#5B6672">Active People</text>
    
    <rect x="216" y="112" width="92" height="56" rx="8" fill="white" stroke="#E5E7EB"/>
    <text x="228" y="132" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#0F4C81">8</text>
    <text x="228" y="148" font-family="Arial, sans-serif" font-weight="500" font-size="8" fill="#5B6672">Medications Due</text>
    
    <rect x="316" y="112" width="96" height="56" rx="8" fill="white" stroke="#E5E7EB"/>
    <text x="328" y="132" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#F59E0B">3</text>
    <text x="328" y="148" font-family="Arial, sans-serif" font-weight="500" font-size="8" fill="#5B6672">Tasks Pending</text>
    
    <!-- Medication Chart -->
    <rect x="116" y="176" width="180" height="100" rx="8" fill="white" stroke="#E5E7EB"/>
    <text x="128" y="194" font-family="Arial, sans-serif" font-weight="600" font-size="10" fill="#1B2430">Medication Schedule</text>
    <rect x="128" y="204" width="156" height="8" rx="4" fill="#E5E7EB"/>
    <rect x="128" y="204" width="140" height="8" rx="4" fill="url(#green)"/>
    <text x="128" y="226" font-family="Arial, sans-serif" font-weight="500" font-size="8" fill="#5B6672">Morning — 85% complete</text>
    <rect x="128" y="236" width="156" height="8" rx="4" fill="#E5E7EB"/>
    <rect x="128" y="236" width="90" height="8" rx="4" fill="#F59E0B"/>
    <text x="128" y="256" font-family="Arial, sans-serif" font-weight="500" font-size="8" fill="#5B6672">Lunch — 55% complete</text>
    <rect x="128" y="262" width="156" height="4" rx="2" fill="#E5E7EB"/>
    
    <!-- Recent Activity -->
    <rect x="304" y="176" width="108" height="100" rx="8" fill="white" stroke="#E5E7EB"/>
    <text x="316" y="194" font-family="Arial, sans-serif" font-weight="600" font-size="10" fill="#1B2430">Recent Activity</text>
    <circle cx="320" cy="212" r="6" fill="#10B981" opacity="0.2"/>
    <circle cx="320" cy="212" r="3" fill="#10B981"/>
    <text x="330" y="214" font-family="Arial, sans-serif" font-weight="500" font-size="8" fill="#5B6672">Care note saved</text>
    <circle cx="320" cy="232" r="6" fill="#0F4C81" opacity="0.2"/>
    <circle cx="320" cy="232" r="3" fill="#0F4C81"/>
    <text x="330" y="234" font-family="Arial, sans-serif" font-weight="500" font-size="8" fill="#5B6672">Med recorded</text>
    <circle cx="320" cy="252" r="6" fill="#F59E0B" opacity="0.2"/>
    <circle cx="320" cy="252" r="3" fill="#F59E0B"/>
    <text x="330" y="254" font-family="Arial, sans-serif" font-weight="500" font-size="8" fill="#5B6672">Task assigned</text>
    <circle cx="320" cy="268" r="4" fill="#5B6672" opacity="0.2"/>
    <circle cx="320" cy="268" r="2" fill="#5B6672"/>
    <text x="330" y="270" font-family="Arial, sans-serif" font-weight="500" font-size="8" fill="#5B6672">+4 more</text>
  </g>
  
  <!-- Floating Elements -->
  <!-- Checkmark Badge -->
  <g transform="translate(620, 80)">
    <circle cx="0" cy="0" r="28" fill="url(#green)"/>
    <path d="M-10,0 L-3,7 L10,-7" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Notification Badge -->
  <g transform="translate(660, 160)">
    <rect x="-40" y="-16" width="80" height="32" rx="8" fill="white" filter="url(#shadow)"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="10" fill="#1B2430">2 new alerts</text>
  </g>
  
  <!-- Heart Icon -->
  <g transform="translate(140, 420)">
    <circle cx="0" cy="0" r="24" fill="#FEE2E2"/>
    <path d="M-8,-4 C-8,-8 -4,-10 0,-6 C4,-10 8,-8 8,-4 C8,0 0,8 0,8 C0,8 -8,0 -8,-4Z" fill="#EF4444"/>
  </g>
  
  <!-- Star Rating -->
  <g transform="translate(680, 380)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" fill="#F59E0B">★★★★★</text>
    <text x="0" y="16" font-family="Arial, sans-serif" font-weight="500" font-size="8" fill="#5B6672">4.9/5 rating</text>
  </g>
</svg>
